<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Tourism Information System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="logo">🌴 Tourism Information System</div>
</header>

<main class="login-page">

    <div class="login-box">

        <h1>Tourism Information System</h1>
        <p>Login to continue</p>

        <label>Email / Username</label>
        <input type="text" placeholder="Enter your email">

        <label>Password</label>
        <input type="password" placeholder="Enter your password">

        <a href="home.html" class="primary-button">
            Login as Customer
        </a>

        <a href="operator.html" class="secondary-button">
            Login as Tour Operator
        </a>

        <p class="small-text">
            Don't have an account? Contact the administrator.
        </p>

    </div>

</main>

</body>
</html>
