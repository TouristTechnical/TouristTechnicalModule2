
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Update Password | TouristTechnical</title>
  <link rel="stylesheet" href="auth.css">
</head>
<body>
  <main class="auth-card">
    <h1>Choose a new password</h1>
    <p>Open this page using the password-reset link sent to your email.</p>

    <form id="passwordForm">
      <label for="password">New password</label>
      <input id="password" type="password" autocomplete="new-password" minlength="8" required>

      <label for="confirmPassword">Confirm new password</label>
      <input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required>

      <button id="submitBtn" type="submit">Update password</button>
    </form>

    <p id="message" class="message" role="status"></p>

    <div class="links">
      <a href="index.html">Back to login</a>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script>
    const supabase = window.supabaseClient;
    const form = document.querySelector('#passwordForm');
    const message = document.querySelector('#message');
    const button = document.querySelector('#submitBtn');

    let recoveryReady = false;

    if (!supabase) {
      message.textContent = 'Supabase failed to load. Please refresh the page.';
      button.disabled = true;
    } else {
      supabase.auth.onAuthStateChange((event, session) => {
        if (event === 'PASSWORD_RECOVERY' && session) {
          recoveryReady = true;
          message.textContent = 'Reset link verified. Enter your new password.';
        }
      });

      async function checkSession() {
        const { data, error } = await supabase.auth.getSession();

        if (error) {
          message.textContent = error.message;
          return;
        }

        if (data.session) {
          recoveryReady = true;
          message.textContent = 'Session detected. You can set your new password.';
        } else {
          message.textContent =
            'Please open this page from your password-reset email. If the link expired, request a new one.';
        }
      }

      checkSession();

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        message.textContent = '';

        const password = document.querySelector('#password').value;
        const confirm = document.querySelector('#confirmPassword').value;

        if (password !== confirm) {
          message.textContent = 'The passwords do not match.';
          return;
        }

        if (!recoveryReady) {
          message.textContent =
            'Open the password-reset link from your email first.';
          return;
        }

        button.disabled = true;
        button.textContent = 'Updating...';

        try {
          const { error } = await supabase.auth.updateUser({ password });

          if (error) throw error;

          message.textContent =
            'Password updated successfully. You can now return to the login page.';

          form.reset();
          await supabase.auth.signOut();
          recoveryReady = false;
        } catch (error) {
          message.textContent =
            error.message || 'Could not update your password. Request a new reset link.';
        } finally {
          button.disabled = false;
          button.textContent = 'Update password';
        }
      });
    }
  </script>
</body>
</html>
