<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Forgot password | TouristTechnical</title><link rel="stylesheet" href="auth.css"></head>
<body><main class="auth-card"><h1>Forgot password?</h1><p>Enter the email address linked to your account. If it is registered, Supabase will send a password-reset email.</p>
<form id="resetForm"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" required><button id="submitBtn" type="submit">Send reset email</button></form><p id="message" class="message" role="status"></p><div class="links"><a href="index.html">Back to login</a><a href="register.html">Create account</a></div></main>
<script type="module">
import { supabase } from './supabase-config.js';
const form = document.querySelector('#resetForm'); const message = document.querySelector('#message'); const button = document.querySelector('#submitBtn');
form.addEventListener('submit', async (event) => {
 event.preventDefault(); message.textContent = ''; button.disabled = true;
 const email = document.querySelector('#email').value.trim();
 const updateUrl = new URL('update-password.html', window.location.href).href;
 try { const { error } = await supabase.auth.resetPasswordForEmail(email, { redirectTo: updateUrl }); if (error) throw error; message.textContent = 'If an account uses that email, a password-reset link will be sent. Check your inbox and spam folder.'; form.reset(); }
 catch (error) { message.textContent = error.message || 'Could not send the reset email. Please try again.'; }
 finally { button.disabled = false; }
});
</script></body></html>
